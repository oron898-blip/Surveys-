<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>סקר הנדסי — מבנים</title>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #38c9a0;
    --warn: #f59e3f;
    --danger: #ef5757;
    --text: #e8eaf6;
    --text2: #8890b5;
    --text3: #555e85;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  .container { max-width: 900px; margin: 20px auto; padding: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  h2 { color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .field { display: flex; flex-direction: column; }
  label { font-size: 13px; color: var(--text2); margin-bottom: 5px; }
  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: var(--radius-sm);
    font-size: 14px;
  }
  .btn-export {
    background: var(--accent2);
    color: #000;
    border: none;
    padding: 15px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    font-size: 16px;
    transition: 0.2s;
  }
  .btn-export:hover { opacity: 0.9; transform: translateY(-2px); }
  #status { text-align: center; margin-top: 10px; color: var(--accent2); }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>פרטי המבנה</h2>
    <div class="grid">
      <div class="field">
        <label>שם המבנה</label>
        <input type="text" id="bName" placeholder="לדוגמה: תחנת משנה">
      </div>
      <div class="field">
        <label>מיקום / עיר</label>
        <input type="text" id="bLocation" placeholder="חיפה">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>ממצאי הסקר</h2>
    <textarea id="bFindings" rows="6" style="width:100%" placeholder="תאר כאן את הממצאים ההנדסיים..."></textarea>
  </div>

  <button class="btn-export" onclick="exportToWord()">ייצוא לדוח Word סופי</button>
  <div id="status"></div>
</div>

<script>
  // פונקציות עזר ליצירת המסמך בהתאם לטמפלייט ההנדסי שלך
  const mkPara = (text, options = {}) => {
    return new docx.Paragraph({
      children: [
        new docx.TextRun({
          text: text,
          bold: !!options.bold,
          size: options.size || 24,
          font: "Arial"
        }),
      ],
      bidirectional: true,
      alignment: docx.AlignmentType.RIGHT,
      spacing: { before: 120, after: 120 }
    });
  };

  const empty = () => new docx.Paragraph({ children: [] });

  async function exportToWord() {
    const status = document.getElementById('status');
    const building = {
      name: document.getElementById('bName').value || 'מבנה כללי',
      location: document.getElementById('bLocation').value || '-',
      findings: document.getElementById('bFindings').value || ''
    };

    try {
      status.textContent = 'מייצר דוח הנדסי...';

      const doc = new docx.Document({
        sections: [{
          properties: { type: docx.SectionType.CONTINUOUS },
          children: [
            // טמפלייט הכותרת שלך
            mkPara("דוח סקר הנדסי - מצב מבנה", { bold: true, size: 32 }),
            empty(),
            mkPara(`שם המבנה: ${building.name}`, { bold: true }),
            mkPara(`מיקום: ${building.location}`),
            empty(),
            
            // תוכן הדוח
            mkPara("ממצאי הסקר:", { bold: true, size: 28 }),
            mkPara(building.findings),
            
            empty(),
            new docx.Paragraph({
                border: { bottom: { color: "auto", space: 1, style: "single", size: 6 } },
                children: []
            }),
            empty(),

            // הצהרות הבודק מהטמפלייט המקורי שלך
            mkPara("הצהרת בודק והגבלות אחריות:", { bold: true }),
            mkPara('• הסקר בוצע בהתאם לתקן 1877 פרק ג - חקירה ראשונית.'),
            mkPara('• הסקר אינו מהווה חוות דעת לבדיקת עמידות המבנה לתקנים הקיימים, לרבות עומסי רוח ורעידת אדמה.'),
            mkPara('• הסקר מתמקד בהיבטים של יציבות המבנה על בסיס בדיקה ויזואלית בלבד.'),
            mkPara('• הנחת העבודה הינה כי לא ניתן להחזיר את המבנה למצבו המקורי.'),
            mkPara('• הממצאים מיועדים למניעת המשך הידרדרות הבלאי הקיים ומפגעים בטיחותיים.'),
            
            empty(),
            mkPara('שימוש לחברת החשמל לישראל בלבד. אין להעתיק/להעביר ללא אישור.', { bold: true }),
          ]
        }]
      });

      // אריזה והורדה
      const blob = await docx.Packer.toBlob(doc);
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `סקר_הנדסי_${building.name.replace(/\s+/g, '_')}.docx`;
      document.body.appendChild(a);
      a.click();
      
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
      status.textContent = 'הדוח הורד בהצלחה!';

    } catch (error) {
      console.error('Export Error:', error);
      status.textContent = 'שגיאה בייצוא: ' + error.message;
    }
  }
</script>

</body>
</html>
